server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery.locator.enabled: true
      routes:
        - id: shopping_cart_service_route
          uri: lb://shopping-cart
          predicates:
            - Path=/shopping-cart/**
          filters:
            - PrefixPath=/api/v1
        - id: shopping_store_service_route
          uri: lb://shopping-store
          predicates:
            - Path=/shopping-store/**
          filters:
            - PrefixPath=/api/v1
            - name: Retry
              args:
                retries: 3
                statuses:
                - INTERNAL_SERVER_ERROR
                exceptions:
                - ru.yandex.practicum.exception.ProductNotFoundException
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: true

management:
  endpoints:
    web:
      exposure:
        include: "gateway,health,info"
      base-path: /actuator
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

